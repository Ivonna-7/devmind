<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevMind · 登录</title>
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { min-height: 100%; }
  body { overflow-x: hidden; }

  .auth-shell {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background: linear-gradient(
      110deg,
      #fff4d6 0%,
      #f8e3b0 26%,
      #f9edcf 45%,
      #faf4e8 60%,
      #faf7f2 100%
    );
  }

  .auth-container {
    width: 100%;
    max-width: 404px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .brand-logo {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 24px;
    text-decoration: none;
    color: inherit;
  }

  .brand-logo .mark {
    width: 40px;
    height: 40px;
    border-radius: 11px;
    background: var(--brand-deep);
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(120,53,15,0.4);
  }

  .brand-logo .name {
    font-family: var(--font-serif);
    font-size: 29px;
    line-height: 1;
    color: var(--ink-900);
  }

  .paper {
    position: relative;
    width: 100%;
    box-sizing: border-box;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 40px 38px 34px;
    box-shadow: 0 1px 2px rgba(28,25,23,0.04), 0 18px 50px rgba(28,25,23,0.08);
  }

  .paper h2 {
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: 32px;
    line-height: 1.1;
    margin: 6px 0 4px;
    color: var(--ink-900);
  }

  .paper .sub {
    font-size: 13.5px;
    color: var(--ink-500);
    margin: 0 0 26px;
  }

  .field {
    margin-bottom: 18px;
  }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-700);
    margin-bottom: 7px;
  }

  .field .ctrl {
    position: relative;
  }

  .field .ctrl > svg.lead {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-400);
    pointer-events: none;
  }

  .field input {
    width: 100%;
    height: 46px;
    background: var(--softer);
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 0 44px 0 40px;
    font-size: 14.5px;
    color: var(--ink-900);
    font-family: inherit;
    box-sizing: border-box;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }

  .field input::placeholder {
    color: var(--ink-400);
  }

  .field input:focus {
    outline: none;
    background: #FFFFFF;
    border-color: rgba(180,83,9,0.45);
    box-shadow: 0 0 0 3px rgba(180,83,9,0.12);
  }

  .pw-toggle {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 34px;
    height: 34px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 0;
    background: transparent;
    color: var(--ink-400);
    cursor: pointer;
    transition: color 0.15s ease, background 0.15s ease;
  }

  .pw-toggle:hover {
    color: var(--brand);
    background: var(--soft);
  }

  .pw-toggle:focus-visible {
    outline: 2px solid rgba(180,83,9,0.5);
    outline-offset: 1px;
  }

  .pw-toggle .eye-off {
    display: none;
  }

  .pw-toggle.is-on .eye-on {
    display: none;
  }

  .pw-toggle.is-on .eye-off {
    display: block;
  }

  .btn-submit {
    width: 100%;
    height: 48px;
    margin-top: 6px;
    border: 1px solid var(--brand);
    border-radius: 12px;
    background: var(--brand);
    color: #FFFFFF;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 1px 3px rgba(180,83,9,0.3);
    transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
  }

  .btn-submit:hover {
    background: var(--brand-hover);
    box-shadow: 0 4px 14px rgba(180,83,9,0.28);
  }

  .btn-submit:active {
    transform: translateY(1px);
  }

  .btn-submit:focus-visible {
    outline: 2px solid var(--brand-deep);
    outline-offset: 2px;
  }

  .foot-note {
    margin-top: 22px;
    padding-top: 20px;
    border-top: 1px solid var(--line-soft);
    font-size: 13.5px;
    color: var(--ink-500);
    text-align: center;
  }

  .foot-note a {
    color: var(--brand);
    font-weight: 600;
    text-decoration: underline;
    text-decoration-color: rgba(180,83,9,0.35);
    text-underline-offset: 3px;
  }

  .foot-note a:hover {
    text-decoration-color: var(--brand);
  }

  .mono-tag {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--ink-400);
    text-align: center;
    margin-top: 18px;
  }

  @media (max-width: 420px) {
    .auth-shell {
      padding: 28px 16px;
    }
    .paper {
      padding: 32px 24px 28px;
      border-radius: 16px;
    }
    .paper h2 {
      font-size: 28px;
    }
  }
</style>
</head>
<body>

<main class="auth-shell">
  <div class="auth-container">
    <a href="03-home.html" class="brand-logo" aria-label="DevMind">
      <span class="mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
        </svg>
      </span>
      <span class="name">DevMind</span>
    </a>

    <form class="paper" method="post" action="#" novalidate>
      <h2>欢迎回来</h2>
      <p class="sub">登录以继续整理你的知识卡册。</p>

      <div class="field">
        <label for="email">邮箱</label>
        <div class="ctrl">
          <svg class="lead" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="4" width="20" height="16" rx="3"/>
            <path d="m3 6 9 7 9-7"/>
          </svg>
          <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="请输入邮箱地址" required>
        </div>
      </div>

      <div class="field">
        <label for="password">密码</label>
        <div class="ctrl">
          <svg class="lead" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="11" width="16" height="10" rx="2"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
          </svg>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="输入密码" required>
          <button type="button" class="pw-toggle" aria-label="显示密码" aria-pressed="false" data-pw-toggle>
            <svg class="eye-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.2A10.9 10.9 0 0 1 12 4c6.5 0 10 7 10 7a18 18 0 0 1-3 3.9M6.6 6.6A18 18 0 0 0 2 11s3.5 7 10 7a10.9 10.9 0 0 0 4.1-.8"/><path d="m3 3 18 18"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        登录
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14"/>
          <path d="m12 5 7 7-7 7"/>
        </svg>
      </button>

      <p class="foot-note">还没有账号？<a href="01-register.html">注册一册属于你的</a></p>
      <p class="mono-tag">devmind.app · email + password</p>
    </form>
  </div>
</main>

<script>
  document.querySelectorAll('[data-pw-toggle]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var input = btn.parentElement.querySelector('input');
      if (!input) return;
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.classList.toggle('is-on', show);
      btn.setAttribute('aria-pressed', String(show));
      btn.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
    });
  });
</script>

</body>
</html>
